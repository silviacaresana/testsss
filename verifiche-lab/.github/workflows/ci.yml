name: CI

on:
  push:
    branches: [main, semplice]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: verifiche-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Il repository non contiene package-lock.json: va generato con `npm install` sul tuo PC e
      # committato. Finché manca, la CI usa `npm install`; poi si può passare a `npm ci`.
      - name: Installa dipendenze (esegue anche prisma generate)
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Costruisce il pacchetto Worker senza pubblicarlo.
      - name: Build per Cloudflare
        run: npx opennextjs-cloudflare build
