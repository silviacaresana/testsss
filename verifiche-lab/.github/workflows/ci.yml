name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build, LaTeX
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-segreto-di-test-lungo-almeno-32-caratteri"
      APP_URL: "http://localhost:3000"
      AI_PROVIDER: "offline"
      AI_MODEL: "demo-deterministico"
      LATEX_ENGINE: "tectonic"
      INSTITUTE_NAME: "Istituto di prova CI"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Genera client Prisma
        run: npx prisma generate

      - name: Prepara database dimostrativo
        run: |
          npx prisma db push
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Installa Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version

      - name: Genera esempi LaTeX
        run: npm run examples

      - name: Controlla LaTeX, PDF e ZIP
        run: npm run latex:check

      - name: Conserva gli esempi
        uses: actions/upload-artifact@v4
        with:
          name: esempi-latex
          path: examples/
          if-no-files-found: error

  e2e:
    name: Smoke test Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "ci-segreto-di-test-lungo-almeno-32-caratteri"
      AI_PROVIDER: "offline"
      LATEX_ENGINE: "tectonic"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Prepara database dimostrativo
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:e2e

      - name: Conserva report e screenshot in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
