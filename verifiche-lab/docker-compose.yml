services:
  app:
    build:
      context: .
    image: verifiche-lab:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Cambiare AUTH_SECRET prima di un deploy reale (minimo 32 caratteri casuali).
      AUTH_SECRET: "${AUTH_SECRET:-cambia-questo-segreto-di-sviluppo-almeno-32-caratteri}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      DATABASE_URL: "file:/data/verifiche.db"
      SESSION_DAYS: "30"
      AI_PROVIDER: "${AI_PROVIDER:-offline}"
      AI_MODEL: "${AI_MODEL:-demo-deterministico}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MONTHLY_BUDGET_EUR: "${AI_MONTHLY_BUDGET_EUR:-30}"
      LATEX_ENGINE: "pdflatex"
      INSTITUTE_NAME: "${INSTITUTE_NAME:-Istituto di Istruzione Superiore}"
      # Demo pronta all'uso. Impostare "false" in produzione e creare l'admin a mano.
      SEED_DEMO: "${SEED_DEMO:-true}"
    volumes:
      - verifiche-data:/data
      - verifiche-storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  verifiche-data:
  verifiche-storage:
